<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wrench" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bg)" />
  <!-- Inner shadow/glow -->
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <!-- Phone body outline -->
  <rect x="22" y="10" width="20" height="36" rx="3" ry="3" fill="none" stroke="url(#phone)" stroke-width="2.5" />
  <!-- Phone screen -->
  <rect x="24.5" y="14" width="15" height="26" rx="1.5" ry="1.5" fill="rgba(34,211,238,0.15)" />
  <!-- Screen circuit lines -->
  <line x1="26" y1="20" x2="32" y2="20" stroke="#22d3ee" stroke-width="1" opacity="0.6" />
  <line x1="26" y1="24" x2="34" y2="24" stroke="#22d3ee" stroke-width="1" opacity="0.4" />
  <line x1="26" y1="28" x2="30" y2="28" stroke="#22d3ee" stroke-width="1" opacity="0.5" />
  <line x1="32" y1="28" x2="38" y2="28" stroke="#22d3ee" stroke-width="1" opacity="0.3" />
  <line x1="26" y1="32" x2="36" y2="32" stroke="#22d3ee" stroke-width="1" opacity="0.4" />
  <!-- Phone home button dot -->
  <circle cx="32" cy="43" r="1.5" fill="url(#phone)" opacity="0.7" />
  <!-- Wrench icon (tilted, overlaid bottom-left) -->
  <g transform="translate(8, 34) rotate(-45, 12, 12)">
    <path d="M4 18 L8 14 L14 14 L18 10 L22 10 L18 14 L18 20 L14 24 L10 20 L10 14 L4 18 Z" fill="url(#wrench)" opacity="0.95"/>
    <rect x="2" y="16" width="8" height="3.5" rx="1.5" ry="1.5" transform="rotate(-45, 6, 18)" fill="url(#wrench)" opacity="0.9"/>
  </g>
  <!-- Small gear accent top-right -->
  <circle cx="48" cy="16" r="5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <circle cx="48" cy="16" r="2" fill="rgba(255,255,255,0.3)" />
  <!-- Sparkle dots -->
  <circle cx="14" cy="14" r="1.5" fill="rgba(34,211,238,0.7)" />
  <circle cx="50" cy="48" r="1" fill="rgba(34,211,238,0.5)" />
  <circle cx="12" cy="48" r="1" fill="rgba(129,140,248,0.5)" />
</svg>