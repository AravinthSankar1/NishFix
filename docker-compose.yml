version: '3.8'

services:
  # PostgreSQL Metadata Database
  postgres:
    image: postgres:16-alpine
    container_name: repair_db_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: repair_software_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Node.js Express REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repair_backend_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:80
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/repair_software_db?schema=public
      JWT_SECRET: super-secret-jwt-token-key-2026-production!
    depends_on:
      postgres:
        condition: service_healthy

  # React Vite Frontend SPA Web Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repair_frontend_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
